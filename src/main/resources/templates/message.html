<!-- Tailwind v4 safelist for dynamic alert colors -->
<div class="hidden">
    text-green-800 bg-green-100 border-green-800
    text-red-800 bg-red-100 border-red-800
    text-yellow-800 bg-yellow-100 border-yellow-800
    text-blue-800 bg-blue-100 border-blue-800
</div>

<div data-th-if="${session.message}"
 data-th-object="${session.message}" 
 data-th-fragment="message"
 data-th-classappend="*{'text-'+type+'-800 rounded-lg bg-'+type+'-100 border border-'+type+'-800'}"
 class="flex items-start p-4 mb-4 text-sm" 
 role="alert">
  <svg class="w-4 h-4 me-2 mt-0.5 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
    fill="none" viewBox="0 0 24 24">
    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
      d="M10 11h2v5m-2 0h4m-2.592-8.5h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
  </svg>
  <div>
    <!-- <span class="font-medium">Info alert!</span> Change a few things up and try submitting again. -->
     <span data-th-text="*{content}"></span>
  </div>
  <th:block data-th-text="${@sessionHelper.removeMessage()}"></th:block>
</div>
