<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content},~{::title})}">
<title>Login Page</title>

<body>
    <div id="content">
        <div class="page-container">
            <div class="form-container">
                <!-- Header -->
                <div class="text-center">
                    <!-- message here -->
                    <div data-th-replace="~{message :: message}"></div>
                    <h2 class="form-title">
                        Login Here
                    </h2>
                    <p class="form-subtitle">
                        Join Linko and start sharing your links
                    </p>
                </div>
                <div class="text-red-600 text-center my-3" th:if="${param.error}">
                    Invalid username or password
                </div>
                <div class="text-green-600 text-center my-3" th:if="${param.logout}">
                    You have been logged out..
                </div>
                <!-- Registration Form -->
                <form class="form" th:action="@{'/authenticate'}" method="POST" th:object="${userForm}" novalidate>
                    <div class="form-fields">


                        <!-- User Name -->
                        <div class="form-field">
                            <label for="email" class="form-label">
                                Email Address
                            </label>
                            <input name="email" id="email" type="email" autocomplete="email" required class="form-input"
                                placeholder="Enter your email">
                            <!-- <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="validate"></p> -->
                        </div>

                        <!-- Password -->
                        <div class="form-field">
                            <label for="password" class="form-label">
                                Password
                            </label>
                            <input name="password" id="password" type="password" autocomplete="new-password" required
                                class="form-input" placeholder="Create a password">
                            <!-- <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="validate"></p> -->
                        </div>




                        <!-- remember me -->
                        <div class="terms-container">
                            <input id="remember" name="terms" type="checkbox" class="terms-checkbox">
                            <label for="remember" class="terms-label">
                                Remember me
                            </label>
                        </div>

                        <!-- Submit Button -->
                        <div>
                            <button type="submit" class="submit-btn">
                                Login
                            </button>
                        </div>

                        <!-- Divider -->
                        <div class="divider-login">
                            <div class="divider-line"></div>
                            <div class="divider-text">
                                <span>Or continue with</span>
                            </div>
                        </div>

                        <!-- Social Login -->
                        <div class="social-buttons">
                            <a data-th-href="@{'/oauth2/authorization/google'}" class="social-btn">
                                <svg class="social-icon" viewBox="0 0 24 24">
                                    <path fill="#4285F4"
                                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                                    <path fill="#34A853"
                                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                                    <path fill="#FBBC05"
                                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                                    <path fill="#EA4335"
                                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                                </svg>
                                Google
                            </a>

                            <a data-th-href="@{'/oauth2/authorization/github'}" class="social-btn">
                                <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
                                    <path fill-rule="evenodd" clip-rule="evenodd" d="M12 0C5.373 0 0 5.373 0 12c0 5.303 
               3.438 9.8 8.207 11.387.6.113.793-.261.793-.582 
               0-.287-.01-1.244-.015-2.255-3.338.726-4.042-1.416-4.042-1.416 
               -.546-1.387-1.333-1.757-1.333-1.757-1.089-.745.083-.729.083-.729 
               1.205.085 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997 
               .107-.775.418-1.305.762-1.605-2.665-.304-5.466-1.332-5.466-5.93 
               0-1.31.469-2.381 1.236-3.221-.124-.303-.536-1.524.117-3.176 
               0 0 1.008-.322 3.3 1.23a11.52 11.52 0 0 1 3-.404c1.02.005 
               2.047.138 3.003.404 2.289-1.552 3.295-1.23 3.295-1.23 
               .656 1.653.244 2.874.12 3.176A4.605 4.605 0 0 1 20 12.07c0 4.61-2.807 
               5.624-5.48 5.92.43.372.823 1.102.823 2.222 
               0 1.606-.015 2.898-.015 3.293 0 .324.192.699.801.58A12.01 
               12.01 0 0 0 24 12c0-6.627-5.373-12-12-12z" />
                                </svg>
                                Github
                            </a>

                        </div>

                        <!-- Login Link -->
                        <div class="login-link-container">
                            <p class="login-link-text">
                                Don't have an account?
                                <a th:href="@{/registor}" class="login-link">
                                    Sign Up
                                </a>
                            </p>
                        </div>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
