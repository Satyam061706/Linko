<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content},~{::title})}">

<head>
    <title>Search Contacts</title>
</head>

<body>
    <div id="content">
        <!-- sidebar -->

        <!-- user is logged in : sidebar -->

        <div th:if="${loggedInUser}">
            <div data-th-replace="~{user/sidebar :: sidebar}"></div>
        </div>


        <div class="main-content" id="main-content">
            <div class="contacts-container">
                <h1 class="contacts-title">Search Result</h1>

                <div class="contacts-controls">
                    <div class="controls-wrapper">
                        <form data-th-object="${contactSearchForm}" action=""
                            data-th-action="@{'/user/contacts/search'}" class="search-form">
                            <div class="search-group">
                                <div>
                                    <select data-th-field="*{field}" id="search-field" class="form-select">
                                        <option value="" selected>Select Field</option>
                                        <option value="name">Name</option>
                                        <option value="phone">Phone</option>
                                        <option value="email">Email</option>
                                    </select>
                                </div>

                                <div class="search-input-wrapper">
                                    <svg class="search-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                        viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd"
                                            d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z"
                                            clip-rule="evenodd" />
                                    </svg>
                                    <input data-th-field="*{value}" type="text" id="table-search-users"
                                        class="search-input" placeholder="Search for contacts...">
                                </div>

                                <button type="submit" class="search-btn">
                                    Search
                                </button>
                            </div>
                        </form>

                        <div>
                            <button type="button" onclick="exportData()" class="export-btn">
                                Export to Excel
                            </button>
                        </div>
                    </div>
                </div>

                <div class="contacts-table-container">
                    <div data-th-replace="~{message :: message}"></div>

                    <table data-th-if="${pageContact.totalElements>0}" class="contacts-table" id="contact-table">
                        <thead>
                            <tr>
                                <th style="width: 30%;">Name</th>
                                <th style="width: 20%;">Phone</th>
                                <th style="width: 20%;">Links</th>
                                <th style="width: 30%;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr data-th-object="${c}" data-th-each="c : ${pageContact.getContent()}">
                                <td>
                                    <div class="contact-cell">
                                        <img th:src="${#strings.isEmpty(c.picture) ? '/images/default-user.png' : c.picture}"
                                            class="contact-avatar" alt="Profile picture"
                                            onerror="this.src='/images/default-user.png'">
                                        <div class="contact-info">
                                            <div class="contact-name" data-th-text="*{name}"></div>
                                            <div class="contact-email" data-th-text="*{email}"></div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div class="contact-phone">
                                        <svg class="phone-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                            viewBox="0 0 24 24" fill="currentColor">
                                            <path fill-rule="evenodd"
                                                d="M1.5 4.5a3 3 0 013-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 01-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 006.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 011.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 01-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5z"
                                                clip-rule="evenodd" />
                                        </svg>
                                        <span data-th-text="*{phoneNumber}"></span>
                                    </div>
                                </td>
                                <td>
                                    <div class="contact-links">
                                        <div data-th-if="*{favorite}" class="favorite-indicator" title="Favorite">
                                            <svg class="favorite-icon" aria-hidden="true"
                                                xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                                fill="currentColor">
                                                <path fill-rule="evenodd"
                                                    d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.006z"
                                                    clip-rule="evenodd" />
                                            </svg>
                                        </div>
                                        <a data-th-href="@{*{websiteLink}}" target="_blank" class="link-icon"
                                            title="Website">
                                            <svg class="link-svg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                                                viewBox="0 0 24 24" fill="currentColor">
                                                <path fill-rule="evenodd"
                                                    d="M19.902 4.098a3.75 3.75 0 00-5.304 0l-4.5 4.5a3.75 3.75 0 001.035 6.037.75.75 0 01-.646 1.353 5.25 5.25 0 01-1.449-8.45l4.5-4.5a5.25 5.25 0 117.424 7.424l-1.757 1.757a.75.75 0 11-1.06-1.06l1.757-1.757a3.75 3.75 0 000-5.304zm-7.389 4.267a.75.75 0 011-.353 5.25 5.25 0 011.449 8.45l-4.5 4.5a5.25 5.25 0 11-7.424-7.424l1.757-1.757a.75.75 0 111.06 1.06l-1.757 1.757a3.75 3.75 0 105.304 5.304l4.5-4.5a3.75 3.75 0 00-1.035-6.037.75.75 0 01-.354-1z"
                                                    clip-rule="evenodd" />
                                            </svg>
                                        </a>
                                        <a data-th-href="@{*{linkedInLink}}" target="_blank" class="link-icon"
                                            title="LinkedIn">
                                            <svg class="simple-linkedin-icon" aria-hidden="true"
                                                xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                                fill="currentColor">
                                                <path
                                                    d="M20.5 2h-17A1.5 1.5 0 002 3.5v17A1.5 1.5 0 003.5 22h17a1.5 1.5 0 001.5-1.5v-17A1.5 1.5 0 0020.5 2zM8 19H5v-9h3zM6.5 8.25A1.75 1.75 0 118.3 6.5a1.78 1.78 0 01-1.8 1.75zM19 19h-3v-4.74c0-1.42-.6-1.93-1.38-1.93A1.74 1.74 0 0013 14.19a.66.66 0 000 .14V19h-3v-9h2.9v1.3a3.11 3.11 0 012.7-1.4c1.55 0 3.36.86 3.36 3.66z">
                                                </path>
                                            </svg>
                                        </a>
                                    </div>
                                </td>
                                <td>
                                    <div class="contact-actions">
                                        <!-- <button th:onclick="deleteContact([[${c.id}]])" class="action-btn delete"
                                            title="Delete">
                                            <svg class="action-icon delete-icon" aria-hidden="true"
                                                xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                                fill="currentColor">
                                                <path fill-rule="evenodd"
                                                    d="M16.5 4.478v.227a48.816 48.816 0 013.878.512.75.75 0 11-.256 1.478l-.209-.035-1.005 13.07a3 3 0 01-2.991 2.77H8.084a3 3 0 01-2.991-2.77L4.087 6.66l-.209.035a.75.75 0 01-.256-1.478A48.567 48.567 0 017.5 4.705v-.227c0-1.564 1.213-2.9 2.816-2.951a52.662 52.662 0 013.369 0c1.603.051 2.815 1.387 2.815 2.951zm-6.136-1.452a51.196 51.196 0 013.273 0C14.39 3.05 15 3.684 15 4.478v.113a49.488 49.488 0 00-6 0v-.113c0-.794.609-1.428 1.364-1.452zm-.355 5.945a.75.75 0 10-1.5.058l.347 9a.75.75 0 101.499-.058l-.346-9zm5.48.058a.75.75 0 10-1.498-.058l-.347 9a.75.75 0 001.5.058l.345-9z"
                                                    clip-rule="evenodd" />
                                            </svg>
                                        </button> -->
                                        <a th:onclick="deleteContact([[${c.id}]])" class="action-btn delete"
                                            title="Delete">
                                            <svg class="action-icon delete-icon" aria-hidden="true"
                                                xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                                fill="currentColor">
                                                <path fill-rule="evenodd"
                                                    d="M16.5 4.478v.227a48.816 48.816 0 013.878.512.75.75 0 11-.256 1.478l-.209-.035-1.005 13.07a3 3 0 01-2.991 2.77H8.084a3 3 0 01-2.991-2.77L4.087 6.66l-.209.035a.75.75 0 01-.256-1.478A48.567 48.567 0 017.5 4.705v-.227c0-1.564 1.213-2.9 2.816-2.951a52.662 52.662 0 013.369 0c1.603.051 2.815 1.387 2.815 2.951zm-6.136-1.452a51.196 51.196 0 013.273 0C14.39 3.05 15 3.684 15 4.478v.113a49.488 49.488 0 00-6 0v-.113c0-.794.609-1.428 1.364-1.452zm-.355 5.945a.75.75 0 10-1.5.058l.347 9a.75.75 0 101.499-.058l-.346-9zm5.48.058a.75.75 0 10-1.498-.058l-.347 9a.75.75 0 001.5.058l.345-9z"
                                                    clip-rule="evenodd" />
                                            </svg>
                                        </a>
                                        <a data-th-href="@{'/user/contacts/view/'+*{id}}" class="action-btn edit"
                                            title="Edit">
                                            <svg class="action-icon edit-icon" aria-hidden="true"
                                                xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                                fill="currentColor">
                                                <path
                                                    d="M21.731 2.269a2.625 2.625 0 00-3.712 0l-1.157 1.157 3.712 3.712 1.157-1.157a2.625 2.625 0 000-3.712zM19.513 8.199l-3.712-3.712-8.4 8.4a5.25 5.25 0 00-1.32 2.214l-.8 2.685a.75.75 0 00.933.933l2.685-.8a5.25 5.25 0 002.214-1.32l8.4-8.4z" />
                                                <path
                                                    d="M5.25 5.25a3 3 0 00-3 3v10.5a3 3 0 003 3h10.5a3 3 0 003-3V13.5a.75.75 0 00-1.5 0v5.25a1.5 1.5 0 01-1.5 1.5H5.25a1.5 1.5 0 01-1.5-1.5V8.25a1.5 1.5 0 011.5-1.5h5.25a.75.75 0 000-1.5H5.25z" />
                                            </svg>
                                        </a>
                                        <a th:onclick="loadContactdata([[${c.id}]])" class="action-btn view"
                                            title="View">
                                            <svg class="action-icon view-icon" aria-hidden="true"
                                                xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                                fill="currentColor">
                                                <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" />
                                                <path fill-rule="evenodd"
                                                    d="M1.323 11.447C2.811 6.976 7.028 3.75 12.001 3.75c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113-1.487 4.471-5.705 7.697-10.677 7.697-4.97 0-9.186-3.223-10.675-7.69a1.762 1.762 0 010-1.113zM17.25 12a5.25 5.25 0 11-10.5 0 5.25 5.25 0 0110.5 0z"
                                                    clip-rule="evenodd" />
                                            </svg>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- Pagination -->
                    <div data-th-if="${pageContact.totalElements>0}" class="pagination-container">
                        <div class="pagination-wrapper">
                            <nav aria-label="Page navigation">
                                <ul class="pagination">
                                    <li data-th-unless="${pageContact.first}" class="pagination-item">
                                        <a data-th-href="@{'/user/contacts?size='+${pageSize}+'&page=' + ${pageContact.number-1}}"
                                            class="pagination-link pagination-nav">
                                            ← Previous
                                        </a>
                                    </li>

                                    <li data-th-each="index : ${#numbers.sequence(0,pageContact.totalPages-1)}"
                                        class="pagination-item">
                                        <a data-th-href="@{'/user/contacts?size='+${pageSize}+'&page='+${index}}"
                                            data-th-classappend="${index==pageContact.number ? 'active' : ''}"
                                            class="pagination-link">
                                            <span data-th-text="${index+1}"></span>
                                        </a>
                                    </li>

                                    <li data-th-unless="${pageContact.last}" class="pagination-item">
                                        <a data-th-href="@{'/user/contacts?size='+${pageSize}+'&page=' + ${pageContact.number+1}}"
                                            class="pagination-link pagination-nav">
                                            Next →
                                        </a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>

                    <!-- No results -->
                    <h1 data-th-if="${pageContact.totalElements<=0}" class="no-results">
                        No contacts found
                    </h1>
                </div>
            </div>
        </div>
    </div>

    <script data-th-src="@{'/js/contacts.js'}"></script>


</body>

</html>
