<div th:fragment="sidebar">
    <!-- Mobile toggle button -->
    <button id="sidebar-toggle" type="button" class="sidebar-toggle-btn">
        <span class="sr-only">Open sidebar</span>
        <svg class="sidebar-toggle-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
            fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h10" />
        </svg>
    </button>

    <!-- Overlay for mobile -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar mt-[50px]">
        <div class="sidebar-content">
            <!-- Close button for mobile -->
            <button id="sidebar-close" class="sidebar-close-btn">
                <svg class="sidebar-close-icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24"
                    height="24" fill="none" viewBox="0 0 24 24">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>

            <a class="flex flex-col items-center ps-2.5 mt-6">
                <img data-th-src="@{${loggedInUser.profilePicture}}" onerror="this.src='/images/default-user.png'"
                    class="h-16 me-3 sm:h-24 shadow-md rounded-full" />

                <span class="text-gray-500" data-th-text="${loggedInUser.name}">Unknown Person</span>
                <span class="text-xl font-semibold">Welcome to
                    Linko</span>
            </a>

            <!-- Navigation menu -->
            <div class="sidebar-nav mt-[20px]">
                <ul class="sidebar-menu">

                    <li>
                        <a data-th-href="@{'/user/profile'}" class="sidebar-menu-item">
                            <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4 0-7 2-7 4v1h14v-1c0-2-3-4-7-4Z" />
                            </svg>
                            <span class="flex-1 ms-3 whitespace-nowrap">Profile</span>
                            <span class="sidebar-badge">Manage</span>
                        </a>
                    </li>
                    <li>
                        <a data-th-href="@{'/user/contacts/add'}" class="sidebar-menu-item">
                            <svg class="sidebar-menu-icon shrink-0" aria-hidden="true" <svg xmlns="www.w3.org"
                                width="24" height="24" fill="none" viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="2" d="M12 5v14m-7-7h14" />
                            </svg>

                            <span class="flex-1 ms-3 whitespace-nowrap">Add Contact</span>
                            <span class="sidebar-notification">2</span>
                        </a>
                    </li>
                    <li>
                        <a data-th-href="@{'/user/contacts'}" class="sidebar-menu-item">
                            <svg class="sidebar-menu-icon shrink-0" aria-hidden="true"
                                xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
                                viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-width="2"
                                    d="M16 19h4a1 1 0 0 0 1-1v-1a3 3 0 0 0-3-3h-2m-2.236-4a3 3 0 1 0 0-4M3 18v-1a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Zm8-10a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                            </svg>
                            <span class="flex-1 ms-3 whitespace-nowrap">Contacts</span>
                        </a>
                    </li>
                    <li>
                        <a data-th-href="@{'/user/direct'}" class="sidebar-menu-item">
                            <svg class="sidebar-menu-icon shrink-0" aria-hidden="true"
                                xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
                                viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M9 10V6a3 3 0 0 1 3-3v0a3 3 0 0 1 3 3v4m3-2 .917 11.923A1 1 0 0 1 17.92 21H6.08a1 1 0 0 1-.997-1.077L6 8h12Z" />
                            </svg>
                            <span class="flex-1 ms-3 whitespace-nowrap">Direct</span>
                        </a>
                    </li>
                    <li>
                        <a data-th-href="@{'/user/contacts/outbox-emails'}" class="sidebar-menu-item">
                            <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 5h18v14H3V5Zm0 0 9 7 9-7" />
                            </svg>
                            <span class="flex-1 ms-3 whitespace-nowrap">Outbox</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </aside>
</div>
